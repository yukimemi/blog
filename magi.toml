# magi competing on this repository.
#
# **Only what is peculiar to this checkout lives here.** The roster
# (`[[agents]]`), `[roles]`, `[graph]` and `[update]` all belong to the
# machine layer (`<config_dir>/magi/config.toml`): they are facts about which
# agent CLIs are installed and what the operator is willing to spend, not
# about this repository, so stating them here would just shadow the machine
# layer for no reason.
#
# What is left, and why it has to be here:
#
# - `[merge] base` — this checkout is jj-colocated, so jj keeps git's HEAD
#   detached at the working-copy commit and the `git symbolic-ref HEAD`
#   fallback in `git::current_branch` cannot infer a base branch. Without it,
#   `magi review` has nothing to diff against and stops. Restated explicitly
#   even though the machine layer happens to default to the same branch name,
#   the same way `~/.config/magi/config.toml`'s own `[merge] base` comment
#   describes doing this once for every jj-colocated checkout on the machine.
# - `[verify]` runs the `tools/postprocess` crate's tests and release build —
#   the only checkable code here; see the comment on the section.
# - `[prompts]` restates this repository's jj-colocated conventions (the
#   machine layer's `[prompts] all` is a plain string field, not an array, so
#   the highest-precedence file's value wins outright rather than appending;
#   leaving it unset here would silently drop that guidance for this repo)
#   and adds the one thing peculiar to this checkout: it is a writing
#   repository, not a code repository.
#
# Note that an array may be declared in exactly one layer
# (`Config::refuse_split_arrays`) — another reason the roster and role lists
# are left untouched here.
#
# Rendered by teravars. Tera braces are live everywhere in this file, but
# comments are stripped before Tera sees them, so a comment may quote
# `{{ ... }}` freely.

[merge]
base = "main"

[vars]
# Shared build cache for the verification commands. Override per machine with
# MAGI_CACHE. `[vars]` is rendered per file, so it lives beside its consumer.
cache = "{{ env.MAGI_CACHE | default(value='/tmp') }}"

[verify]
# No CI builds or checks the site (`.github/workflows/` has only
# `apm-bump.yml` and `kata-apply.yml`), so this mirrors the one real build
# path: `build.sh` runs `cargo build --release` on `tools/postprocess` for
# Cloudflare Pages. Zola and Pagefind stay out — not Rust/bun/deno.
#
# `deno fmt --check` is not gated: no workflow or hook enforces it, and
# `deno.json` excludes `content/`, so it would not check posts anyway.
#
# CARGO_TARGET_DIR is shared so candidate worktrees reuse one build.
e2e = [
  "CARGO_TARGET_DIR={{ vars.cache }}/blog-postprocess-target cargo test --locked --manifest-path tools/postprocess/Cargo.toml",
]
gate = [
  "CARGO_TARGET_DIR={{ vars.cache }}/blog-postprocess-target cargo test --locked --manifest-path tools/postprocess/Cargo.toml",
  "CARGO_TARGET_DIR={{ vars.cache }}/blog-postprocess-target cargo build --locked --release --manifest-path tools/postprocess/Cargo.toml",
]

[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` \
works in a candidate worktree and is what magi expects, but never run `jj` \
commands and never touch the main working copy.

This is a blog: the tree under review is Markdown articles and Zola/Deno \
site-authoring plumbing, not application code. Judge and review it as \
writing and static-site tooling, not as a service or library.
"""
